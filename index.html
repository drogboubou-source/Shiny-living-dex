<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Shiny Living Dex</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./Assets/icon-192.png">
<link rel="apple-touch-icon" href="./Assets/icon-192.png">
<meta name="theme-color" content="#131525">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LivingDex">
<style>
:root{
  --bg:#131525;
  --surface:#1d1e2d;
  --surface2:#2a2b3f;
  --border:rgba(255,255,255,.08);
  --text:#e8e8f0;
  --muted:#8a8aa0;
  --purple:#c084fc;
  --gold:#eab308;
  --green:#4ade80;
  --font:'Pokemon 3DS','Segoe UI',sans-serif;
  --r:12px;
  --r-lg:18px;
  --header-h:58px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);font-family:var(--font);
  overflow:hidden;
}
button{font-family:inherit;color:inherit}

/* ── TOPBAR ── */
.home-topbar{
  position:fixed;top:0;left:0;right:0;height:var(--header-h);
  display:flex;align-items:center;gap:14px;
  padding:0 max(14px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-right));
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.01)),var(--surface);
  border-bottom:1px solid var(--border);
  box-shadow:0 8px 22px rgba(0,0,0,.28);
  z-index:200;
}
.home-logo{
  display:flex;align-items:center;gap:8px;flex-shrink:0;
  font-size:13px;font-weight:700;letter-spacing:.3px;white-space:nowrap;
}
.home-logo img{width:26px;height:26px;border-radius:7px;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.home-logo .shiny{color:var(--purple)}

.tabbar{
  display:flex;gap:4px;background:rgba(255,255,255,.045);border:1px solid var(--border);
  border-radius:999px;padding:3px;margin-left:auto;
}
.tabbar button{
  border:0;background:transparent;color:var(--muted);border-radius:999px;
  padding:8px 15px;font-size:12.5px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;gap:6px;transition:background .15s,color .15s;
  white-space:nowrap;
}
.tabbar button svg{width:15px;height:15px;flex-shrink:0}
.tabbar button.active{
  background:linear-gradient(180deg,rgba(192,132,252,.28),rgba(192,132,252,.14));
  color:#fff;box-shadow:inset 0 0 0 1px rgba(192,132,252,.5);
}
.tabbar button:not(.active):hover{color:#fff;background:rgba(255,255,255,.06)}

/* ── PANELS ── */
.home-content{position:fixed;top:var(--header-h);left:0;right:0;bottom:0;overflow:hidden}
.tab-panel{display:none;width:100%;height:100%;overflow:hidden}
.tab-panel.active{display:block}
.dex-frame{width:100%;height:100%;border:0;display:block;background:var(--bg)}

/* ── JEUX TAB ── */
#tab-jeux{overflow-y:auto;-webkit-overflow-scrolling:touch}
.jeux-wrap{max-width:960px;margin:0 auto;padding:22px 16px 60px}
.jeux-head{margin-bottom:20px}
.jeux-head h1{font-size:20px;margin-bottom:4px}
.jeux-head p{font-size:12.5px;color:var(--muted)}

.jeux-summary{
  display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 22px;
}
.jeux-summary .pill{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:10px 14px;font-size:12px;color:var(--muted);flex:1;min-width:130px;
}
.jeux-summary .pill strong{display:block;font-size:19px;color:var(--text);margin-top:2px;font-variant-numeric:tabular-nums}

.game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}

.game-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 10px 26px rgba(0,0,0,.22);
}
.game-cover{
  position:relative;height:120px;background-size:cover;background-position:center;
}
.game-cover::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(19,21,37,0) 30%,rgba(19,21,37,.92) 100%);
}
.game-cover .platform-tag{
  position:absolute;top:10px;left:10px;z-index:1;
  background:rgba(0,0,0,.5);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.14);
  border-radius:999px;padding:3px 10px;font-size:10px;font-weight:700;letter-spacing:.3px;
}
.game-cover .game-title{
  position:absolute;left:14px;right:14px;bottom:10px;z-index:1;
  font-size:16px;font-weight:800;text-shadow:0 2px 8px rgba(0,0,0,.6);
}
.game-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.game-progress-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}
.game-progress-row .pct{font-size:20px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}
.game-progress-row .pct.done{color:var(--green)}
.bar-track{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--purple),var(--gold));transition:width .3s ease}
.bar-fill.done{background:linear-gradient(90deg,var(--green),#22c55e)}

.game-toggle{
  border:1px solid var(--border);background:rgba(255,255,255,.03);border-radius:10px;
  padding:8px 10px;font-size:12px;font-weight:700;color:var(--text);cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;
}
.game-toggle .chev{transition:transform .18s ease;opacity:.7}
.game-toggle.open .chev{transform:rotate(180deg)}

.checklist{display:none;flex-direction:column;gap:14px;margin-top:2px}
.checklist.open{display:flex}
.check-group-title{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--purple);
  font-weight:800;margin-bottom:6px;
}
.check-item{
  display:flex;align-items:flex-start;gap:9px;padding:7px 8px;border-radius:8px;
  font-size:12.5px;line-height:1.35;cursor:pointer;
}
.check-item:hover{background:rgba(255,255,255,.04)}
.check-item input{
  appearance:none;width:17px;height:17px;flex-shrink:0;margin-top:1px;
  border:2px solid var(--muted);border-radius:5px;cursor:pointer;position:relative;
}
.check-item input:checked{background:var(--green);border-color:var(--green)}
.check-item input:checked::after{
  content:'';position:absolute;left:4px;top:0px;width:4px;height:8px;
  border:solid #0b1622;border-width:0 2px 2px 0;transform:rotate(45deg);
}
.check-item span.done-text{text-decoration:line-through;color:var(--muted)}

.add-game-card{
  border:2px dashed var(--border);border-radius:var(--r-lg);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;
  min-height:150px;color:var(--muted);cursor:pointer;font-size:13px;font-weight:700;
  background:rgba(255,255,255,.02);
}
.add-game-card:hover{color:var(--text);border-color:rgba(192,132,252,.5)}
.add-game-card .plus{font-size:26px;line-height:1}

/* ── modal add game ── */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:500;padding:16px}
.modal-backdrop.open{display:flex}
.add-modal{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-lg);width:100%;max-width:420px;padding:18px;display:flex;flex-direction:column;gap:10px;max-height:85vh;overflow-y:auto}
.add-modal h2{font-size:15px;margin-bottom:2px}
.add-modal label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.add-modal input[type=text],.add-modal textarea{
  width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;
  color:var(--text);padding:9px 10px;font-family:inherit;font-size:13px;resize:vertical;
}
.add-modal textarea{min-height:100px}
.add-modal .modal-actions{display:flex;gap:8px;margin-top:6px}
.add-modal .btn{flex:1;border:0;border-radius:9px;padding:10px;font-weight:800;font-size:13px;cursor:pointer}
.add-modal .btn.primary{background:linear-gradient(180deg,var(--purple),#a855f7);color:#1a0e28}
.add-modal .btn.secondary{background:rgba(255,255,255,.08);color:var(--text)}

@media (max-width:520px){
  .home-logo span.wordmark{display:none}
  .tabbar button{padding:8px 11px;font-size:11.5px}
}
</style>
</head>
<body>

<div class="home-topbar">
  <div class="home-logo">
    <img src="./Assets/icon-192.png" alt="">
    <span class="wordmark"><span class="shiny">Shiny</span> Living Dex</span>
  </div>
  <div class="tabbar" role="tablist">
    <button id="tabBtnDex" class="active" role="tab" aria-selected="true" onclick="switchTab('dex')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 010 18M12 3a15 15 0 000 18"/></svg>
      Shiny Living Dex
    </button>
    <button id="tabBtnJeux" role="tab" aria-selected="false" onclick="switchTab('jeux')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="12" rx="4"/><path d="M8 11v4M6 13h4M15.5 12.5h.01M18.5 14.5h.01"/></svg>
      Jeux
    </button>
  </div>
</div>

<div class="home-content">

  <div id="tab-dex" class="tab-panel active">
    <iframe class="dex-frame" id="dexFrame" title="Shiny Living Dex" src="./dex.html" loading="eager"></iframe>
  </div>

  <div id="tab-jeux" class="tab-panel">
    <div class="jeux-wrap">
      <div class="jeux-head">
        <h1>Mes jeux</h1>
        <p>Suivi de progression vers le 100% sur chaque jeu.</p>
      </div>

      <div class="jeux-summary" id="jeuxSummary"></div>

      <div class="game-grid" id="gameGrid"></div>
    </div>
  </div>

</div>

<div class="modal-backdrop" id="addModalBackdrop">
  <div class="add-modal">
    <h2>Ajouter un jeu</h2>
    <div>
      <label>Nom du jeu</label>
      <input type="text" id="newGameName" placeholder="Ex: Pokémon Violet">
    </div>
    <div>
      <label>Plateforme</label>
      <input type="text" id="newGamePlatform" placeholder="Ex: Switch">
    </div>
    <div>
      <label>Étapes pour le 100% (une par ligne)</label>
      <textarea id="newGameChecklist" placeholder="Terminer l'histoire principale
Compléter le Pokédex
..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeAddModal()">Annuler</button>
      <button class="btn primary" onclick="saveNewGame()">Ajouter</button>
    </div>
  </div>
</div>

<script>
/* ───────────── TABS ───────────── */
function switchTab(tab){
  document.getElementById('tab-dex').classList.toggle('active', tab==='dex');
  document.getElementById('tab-jeux').classList.toggle('active', tab==='jeux');
  document.getElementById('tabBtnDex').classList.toggle('active', tab==='dex');
  document.getElementById('tabBtnJeux').classList.toggle('active', tab==='jeux');
  document.getElementById('tabBtnDex').setAttribute('aria-selected', tab==='dex');
  document.getElementById('tabBtnJeux').setAttribute('aria-selected', tab==='jeux');
  try{ localStorage.setItem('homeActiveTab', tab); }catch(e){}
}
(function initTab(){
  let saved='dex';
  try{ saved = localStorage.getItem('homeActiveTab') || 'dex'; }catch(e){}
  if(saved==='jeux') switchTab('jeux');
})();

/* ───────────── JEUX DASHBOARD ───────────── */
const STORAGE_KEY = 'gamesDashboard_v1';

const DEFAULT_GAMES = [
  {
    id: 'epee',
    name: 'Pokémon Épée',
    platform: 'Switch',
    cover: './region-galar.jpg',
    groups: [
      { title: 'Terminé', items: [
        { id:'ep1', label:"Terminer l'histoire principale (Ligue Galar)" },
        { id:'ep2', label:"Compléter le Pokédex régional de Galar" },
        { id:'ep3', label:"Terminer le contenu additionnel (Île Solitaire & Toundra Couronnée)" },
        { id:'ep4', label:"Débloquer tous les Pokémon obtenables de la version" },
      ]}
    ],
    forceComplete:true
  },
  {
    id: 'ecarlate',
    name: 'Pokémon Écarlate',
    platform: 'Switch',
    cover: './region-paldea.jpg',
    groups: [
      { title: 'Histoire principale', items: [
        { id:'ec1', label:'Devenir Champion (terminer la Ligue Pokémon)' },
        { id:'ec2', label:'Terminer la Voie de la Légende (vaincre les 5 Titans)' },
        { id:'ec3', label:'Terminer le Chemin des étoiles (vaincre les 5 bases Team Star)' },
        { id:'ec4', label:"Terminer l'épilogue Zone Zéro (post-histoire)" },
      ]},
      { title: 'Pokédex', items: [
        { id:'ec5', label:'Voir et capturer tous les Pokémon de Paldea (Pokédex régional)' },
        { id:'ec6', label:'Capturer Koraidon et les Pokémon légendaires/mystiques disponibles' },
        { id:'ec7', label:'Échanger pour obtenir les exclusifs de version Violet' },
      ]},
      { title: 'Post-game & combats', items: [
        { id:'ec8', label:"Débloquer et terminer le Tournoi de l'Académie" },
        { id:'ec9', label:'Réussir un Téra-Raid 5 étoiles de chaque type' },
        { id:'ec10', label:'Débloquer et vaincre les Téra-Raids 6 étoiles (Raids noir/blanc)' },
      ]},
      { title: 'Extras', items: [
        { id:'ec11', label:'Débloquer toutes les recettes de CT' },
        { id:'ec12', label:'Débloquer toutes les tenues et coiffures du salon' },
        { id:'ec13', label:'Terminer toutes les quêtes secondaires des PNJ' },
      ]},
      { title: 'DLC (Le Masque Turquoise & Le Disque Indigo)', items: [
        { id:'ec14', label:"Terminer l'histoire du Masque Turquoise (Kitakami)" },
        { id:'ec15', label:"Terminer l'histoire du Disque Indigo (Terrarium)" },
        { id:'ec16', label:'Compléter le Pokédex de Kitakami et du Terrarium' },
        { id:'ec17', label:'Vaincre la Ligue Bleuet (les 4 champions du BB League)' },
      ]},
    ]
  }
];

function loadData(){
  let data = { checked:{}, customGames:[] };
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) data = Object.assign(data, JSON.parse(raw));
  }catch(e){}
  return data;
}
function saveData(data){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){}
}

let dashData = loadData();

function allGames(){
  return DEFAULT_GAMES.concat(dashData.customGames || []);
}

function isChecked(gameId, itemId, forceComplete){
  if(forceComplete) return true;
  const key = gameId+'::'+itemId;
  return !!dashData.checked[key];
}
function toggleCheck(gameId, itemId){
  const key = gameId+'::'+itemId;
  dashData.checked[key] = !dashData.checked[key];
  saveData(dashData);
  renderGames();
}

function gameStats(game){
  let total=0, done=0;
  game.groups.forEach(g=>g.items.forEach(it=>{
    total++;
    if(isChecked(game.id, it.id, game.forceComplete)) done++;
  }));
  const pct = total ? Math.round(done/total*100) : 0;
  return {total, done, pct};
}

function renderSummary(){
  const games = allGames();
  const finished = games.filter(g=>gameStats(g).pct===100).length;
  const el = document.getElementById('jeuxSummary');
  el.innerHTML = `
    <div class="pill">Jeux suivis<strong>${games.length}</strong></div>
    <div class="pill">Terminés à 100%<strong>${finished}</strong></div>
    <div class="pill">En cours<strong>${games.length-finished}</strong></div>
  `;
}

function renderGames(){
  renderSummary();
  const grid = document.getElementById('gameGrid');
  const games = allGames();
  grid.innerHTML = games.map(game=>{
    const stats = gameStats(game);
    const total = stats.total, done = stats.done, pct = stats.pct;
    const isDone = pct===100;
    const groupsHtml = game.groups.map(g=>`
      <div>
        <div class="check-group-title">${g.title}</div>
        ${g.items.map(it=>{
          const checked = isChecked(game.id, it.id, game.forceComplete);
          return `<label class="check-item">
            <input type="checkbox" ${checked?'checked':''} ${game.forceComplete?'disabled':''} onchange="toggleCheck('${game.id}','${it.id}')">
            <span class="${checked?'done-text':''}">${it.label}</span>
          </label>`;
        }).join('')}
      </div>
    `).join('');
    return `
      <div class="game-card">
        <div class="game-cover" style="background-image:url('${game.cover}')">
          <span class="platform-tag">${game.platform}</span>
          <span class="game-title">${game.name}</span>
        </div>
        <div class="game-body">
          <div class="game-progress-row">
            <span>${done}/${total} étapes</span>
            <span class="pct ${isDone?'done':''}">${pct}%</span>
          </div>
          <div class="bar-track"><div class="bar-fill ${isDone?'done':''}" style="width:${pct}%"></div></div>
          <button class="game-toggle" onclick="toggleChecklist(this)">
            <span>${isDone ? 'Voir le détail' : 'Voir les étapes du 100%'}</span>
            <span class="chev">▾</span>
          </button>
          <div class="checklist">${groupsHtml}</div>
        </div>
      </div>
    `;
  }).join('') + `
    <div class="add-game-card" onclick="openAddModal()">
      <span class="plus">+</span>
      <span>Ajouter un jeu</span>
    </div>
  `;
}

function toggleChecklist(btn){
  btn.classList.toggle('open');
  btn.nextElementSibling.classList.toggle('open');
}

/* ── add game modal ── */
function openAddModal(){ document.getElementById('addModalBackdrop').classList.add('open'); }
function closeAddModal(){
  document.getElementById('addModalBackdrop').classList.remove('open');
  document.getElementById('newGameName').value='';
  document.getElementById('newGamePlatform').value='';
  document.getElementById('newGameChecklist').value='';
}
function saveNewGame(){
  const name = document.getElementById('newGameName').value.trim();
  const platform = document.getElementById('newGamePlatform').value.trim() || 'Autre';
  const lines = document.getElementById('newGameChecklist').value.split('\n').map(l=>l.trim()).filter(Boolean);
  if(!name || !lines.length){ alert('Merci de renseigner un nom de jeu et au moins une étape.'); return; }
  const id = 'custom_'+Date.now();
  const game = {
    id, name, platform,
    cover: './Assets/splash-art.jpg',
    groups: [{ title:'Étapes vers le 100%', items: lines.map((l,i)=>({id:'i'+i, label:l})) }]
  };
  dashData.customGames = dashData.customGames || [];
  dashData.customGames.push(game);
  saveData(dashData);
  closeAddModal();
  renderGames();
}

renderGames();
</script>
</body>
</html>
